server:
  port: 8080

spring:
  application:
    name: immotran-ms-core

  # Base de donnees H2 en memoire : elle existe seulement pendant que
  # l'application tourne, et repart a zero a chaque redemarrage. Ideal
  # pour developper et tester en local, sans rien installer. On la
  # remplacera par une vraie base (PostgreSQL/RDS) uniquement au moment
  # de deployer sur AWS (etape volontairement reportee).
  datasource:
    url: jdbc:h2:mem:coredb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    # Cree/rafraichit automatiquement les tables a partir des entites
    # Java au demarrage. Pratique pour une seule instance locale ; sur
    # une vraie base partagee on utilisera plutot des migrations
    # versionnees (Flyway/Liquibase) - hors scope de ce premier recit.
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Console web H2, utile pour inspecter les donnees pendant le test
  # manuel : http://localhost:8080/h2-console (JDBC URL ci-dessus)
  h2:
    console:
      enabled: true

# Coordonnees du MEME User Pool Cognito qu'immotran-ms-identity : ce
# service verifie les jetons independamment, sans jamais appeler
# immotran-ms-identity par le reseau (chaque microservice fait confiance
# au claim tenant_id du jeton, voir TenantClaims).
immotran:
  cognito:
    region: ${COGNITO_REGION:ca-central-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:REPLACE_ME_ONCE_POOL_EXISTS}
  # Utilise uniquement si --spring.profiles.active=local (voir SecurityConfig.localJwtDecoder).
  # Doit etre IDENTIQUE a environment.mockAuthSharedSecret dans immotran-ui-ng.
  local-auth:
    shared-secret: ${LOCAL_AUTH_SHARED_SECRET:local-dev-only-shared-secret-please-change-0123456789}

management:
  endpoints:
    web:
      exposure:
        include: health,info
